<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dream Tapir · 访问验证</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #f4f6fc;
      --surface: #ffffff;
      --ink: #0c1324;
      --muted: #667089;
      --muted-2: #8b94ab;
      --line: #e4e8f2;
      --brand: #4c63ff;
      --brand-2: #7b5cff;
      --red: #e0464b;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(900px 500px at 8% -8%, #e7ebff 0%, rgba(231, 235, 255, 0) 62%),
        radial-gradient(760px 460px at 100% 0%, #f2e9ff 0%, rgba(242, 233, 255, 0) 58%),
        var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: min(384px, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.09);
      padding: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-bottom: 18px;
    }

    .mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      box-shadow: 0 8px 20px rgba(76, 99, 255, 0.28);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.5px;
      flex: none;
    }

    .brand strong {
      display: block;
      font-size: 14px;
    }

    .brand span {
      font-size: 11px;
      color: var(--muted-2);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
      letter-spacing: -0.4px;
    }

    p {
      margin: 0 0 16px;
      font-size: 12.5px;
      line-height: 1.65;
      color: var(--muted);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    input {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
      padding: 9px 12px;
      font: inherit;
      font-size: 14px;
      color: inherit;
      outline: 0;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(76, 99, 255, 0.1);
    }

    button {
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(76, 99, 255, 0.26);
    }

    .error {
      min-height: 17px;
      margin-top: 8px;
      font-size: 12px;
      color: var(--red);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <span class="mark">DT</span>
      <div>
        <strong>Dream Tapir</strong>
        <span>小程序中心</span>
      </div>
    </div>
    <h1>需要访问密钥</h1>
    <p>请输入管理员提供的访问密钥，验证通过后 12 小时内免重复输入。</p>
    <form id="gate-form">
      <input
        id="gate-key"
        type="password"
        placeholder="访问密钥"
        autocomplete="current-password"
        spellcheck="false"
        autofocus
      />
      <button type="submit">进入</button>
    </form>
    <div class="error" id="gate-error" role="alert"></div>
  </main>

  <script>
    (function () {
      "use strict";

      var COOKIE = "dt_key";
      var input = document.getElementById("gate-key");
      var error = document.getElementById("gate-error");

      // 带着 dt_key 还被 Nginx 送回本页，说明密钥不对，清掉并提示。
      if (document.cookie.indexOf(COOKIE + "=") !== -1) {
        document.cookie = COOKIE + "=; path=/; max-age=0";
        error.textContent = "密钥不正确，请重试";
      }

      document.getElementById("gate-form").addEventListener("submit", function (event) {
        event.preventDefault();
        var value = input.value.trim();
        if (!value) {
          error.textContent = "请输入访问密钥";
          return;
        }
        document.cookie = COOKIE + "=" + value + "; path=/; max-age=43200; SameSite=Lax";
        window.location.replace("/");
      });

      input.focus();
    })();
  </script>
</body>
</html>
